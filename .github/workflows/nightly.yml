name: Zalmoxis nightly

on:
  schedule:
    # 02:00 UTC daily. CRON syntax is in UTC; 02:00 UTC is roughly
    # 03:00 / 04:00 CET (DST-dependent). Adjust the hour if you'd
    # rather pin to a specific local time.
    - cron: "0 2 * * *"
  # Manual trigger for ad-hoc runs (e.g. before cutting a release,
  # or to verify the suite on a feature branch via
  # ``gh workflow run "Zalmoxis nightly" -r <branch>``).
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents.
# Coverage upload uses the CODECOV_TOKEN secret directly, not the
# default GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: unit + smoke + integration with coverage, as four parallel jobs. Not on push or PR
# CI: each smoke or integration test runs a full solve (5-10 min on a 2-vCPU runner under
# coverage), which adds no bug-finding signal to the unit suite.
jobs:
  nightly:
    name: Zalmoxis-nightly ${{ matrix.suite }} (ubuntu-latest)
    runs-on: ubuntu-latest
    # The full solves on the Wolf & Bower tables, the full adiabatic PALEOS solves at 5 M_earth and
    # the real solves of the accept and invariant tests run in their own jobs, beside the rest.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            select: (unit or smoke or integration) and not slow and not wolfbower and not paleos_adiabat and not accept_solves
            args: --dist load --cov-fail-under=90
          - suite: wolfbower
            select: wolfbower
            args: --dist loadfile --cov-fail-under=0
          - suite: paleos_adiabat
            select: paleos_adiabat
            args: --dist loadfile --cov-fail-under=0
          - suite: accept_solves
            select: accept_solves and not wolfbower
            args: --dist load --cov-fail-under=0 --durations=0
    # A 90 min ceiling per job leaves wide margin for shared-runner variance.
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the package version from the latest
          # git tag; needs full history.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.9"

      - name: Set ZALMOXIS_ROOT and FWL_DATA
        run: |
          echo "ZALMOXIS_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "FWL_DATA=$RUNNER_TEMP/fwl_data" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov pytest-xdist pytest-timeout hypothesis

      # The pins live in the installed fwl-io and in src/zalmoxis/datasets.
      - name: Resolve the data cache key
        id: datakey
        run: echo "fwlio=$(python -c 'import fwl_io; print(fwl_io.__version__)')" >> "$GITHUB_OUTPUT"

      # data/ holds links into FWL_DATA, so the cache holds FWL_DATA; a moved key starts
      # from the previous tree, and the setup fetches only missing or damaged files.
      - name: Cache the fwl-io data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fwl_data
          key: zalmoxis-fwl-data-${{ runner.os }}-${{ steps.datakey.outputs.fwlio }}-${{ hashFiles('src/zalmoxis/datasets/*.toml', 'src/zalmoxis/datasets/*.txt') }}
          restore-keys: |
            zalmoxis-fwl-data-${{ runner.os }}-

      - name: Fetch the input data and link it into data/
        run: |
          bash tools/setup/get_zalmoxis.sh

      # Drops versions no installed manifest pins, so a restored tree does not grow; a refusal
      # only costs cache space, so it warns instead of failing the tests.
      - name: Prune superseded data versions
        run: fwl-io prune --delete --yes || echo "::warning::fwl-io prune did not run"

      - name: Run unit + smoke + integration tests with coverage
        env:
          ZALMOXIS_NEED_WOLFBOWER: ${{ matrix.suite == 'wolfbower' && '1' || '' }}
        run: |
          # --timeout kills any single hung test after 50 min, failing the
          # run and naming that test in the worker-crash report while the
          # other workers still finish, instead of the job ceiling cancelling
          # the whole run with no clue which test wedged. The slowest healthy
          # test is ~20 min on the 2-vCPU runner under coverage, so 3000 s
          # (about 2.4x) absorbs runner variance without risking a false kill.
          # --durations prints the slowest tests so the profile stays visible.
          pytest -m "${{ matrix.select }}" -n auto -o "addopts=" \
            --timeout=3000 --timeout-method=thread --durations=25 \
            --cov=zalmoxis --cov-report=term-missing --cov-report=xml \
            ${{ matrix.args }}

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Zalmoxis
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false
