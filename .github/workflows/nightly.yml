name: Zalmoxis nightly

on:
  schedule:
    # 02:00 UTC daily. CRON syntax is in UTC; 02:00 UTC is roughly
    # 03:00 / 04:00 CET (DST-dependent). Adjust the hour if you'd
    # rather pin to a specific local time.
    - cron: "0 2 * * *"
  # Manual trigger for ad-hoc runs (e.g. before cutting a release,
  # or to verify the suite on a feature branch via
  # ``gh workflow run "Zalmoxis nightly" -r <branch>``).
  workflow_dispatch:

# Least-privilege token: only read access to the repo contents.
# Coverage upload uses the CODECOV_TOKEN secret directly, not the
# default GITHUB_TOKEN.
permissions:
  contents: read

# Nightly: unit + smoke + integration with coverage, as parallel jobs. Not on push or PR
# CI: each smoke or integration test runs a full solve (5-10 min on a 4-vCPU runner under
# coverage), which adds no bug-finding signal to the unit suite.
env:
  # the test id that the matrix entries with split: deselect leave out and split: only run alone
  CORE_SPLIT: tests/test_core_two_phase_solve.py::test_the_adiabat_crosses_the_icb_at_its_pressure

jobs:
  nightly:
    name: Zalmoxis-nightly ${{ matrix.suite }} (ubuntu-latest)
    runs-on: ubuntu-latest
    # The Wolf & Bower solves, the adiabatic PALEOS solves at 5 M_earth, the real accept solves
    # (one job per file, 5 whole-tree jobs for the longest), the grid start-up reference, the
    # two-layer core solves and the default bit-identity solve (alone) run in their own jobs.
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: main
            select: (unit or smoke or integration) and not slow and not wolfbower and not paleos_adiabat and not accept_solves and not accept_solves_long and not accept_solves_newton_setups and not accept_solves_reference and not core_two_phase and not default_invariance
            args: --dist load --cov-fail-under=90
            job_timeout: 170
          - suite: wolfbower
            select: wolfbower
            args: --dist loadgroup --loadscope-reorder --cov-fail-under=0 -v
            job_timeout: 170
          - suite: paleos_adiabat
            select: paleos_adiabat and not wolfbower
            args: --dist loadfile --cov-fail-under=0
          - suite: accept_solves_invariants
            select: accept_solves and not accept_solves_long and not accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 tests/test_invariants.py
          - suite: accept_solves_long
            select: accept_solves_long and not accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0
            test_timeout: 7200
            job_timeout: 150
          - suite: accept_solves_reference
            select: accept_solves_reference and not accept_solves and not accept_solves_long and not accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 -rP
            test_timeout: 7800
            job_timeout: 150
          - suite: accept_solves_newton_setups_paleos_10
            select: accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 -k "paleos_10_numpy or analytic_1"
            job_timeout: 170
          - suite: accept_solves_newton_setups_paleos_1
            select: accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 -k "paleos_1_numpy or paleos_3_jax"
            job_timeout: 170
          - suite: accept_solves_newton_setups_paleos_5
            select: accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 -k "paleos_5_numpy or paleos_1_jax"
            job_timeout: 170
          - suite: accept_solves_newton_setups_within_the_cap
            select: accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 -k "within_the_cap"
            job_timeout: 170
          - suite: accept_solves_accepted_on
            select: accept_solves and not accept_solves_long and not accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 tests/test_accepted_on.py
          - suite: core_two_phase
            select: core_two_phase and not wolfbower and not paleos_adiabat and not accept_solves and not accept_solves_long and not accept_solves_newton_setups and not accept_solves_reference
            args: --dist load --cov-fail-under=0 --durations=0
            job_timeout: 120
            threads: 1
            split: deselect
          - suite: core_two_phase_icb_cross
            select: core_two_phase and not wolfbower and not paleos_adiabat and not accept_solves and not accept_solves_long and not accept_solves_newton_setups and not accept_solves_reference
            # 2 workers: the 5 ICB-cross solves in 3 waves, about 3 x 1000 s on the CI runner
            args: --dist load --cov-fail-under=0 --durations=0 -n 2
            job_timeout: 120
            threads: 1
            split: only
          - suite: accept_solves_pressure_root
            select: accept_solves and not accept_solves_long and not accept_solves_newton_setups and not wolfbower and not paleos_adiabat
            args: --dist load --cov-fail-under=0 --durations=0 tests/test_pressure_root_solves.py
          - suite: default_invariance
            select: default_invariance and not wolfbower and not paleos_adiabat and not accept_solves and not accept_solves_long and not accept_solves_newton_setups and not core_two_phase and not accept_solves_reference
            args: --cov-fail-under=0 --durations=0
    # 90 min per job, 170 min for main, wolfbower and each Newton setup job, 150 min for
    # accept_solves_long and accept_solves_reference, 120 min for each core job; the Newton
    # setup sweep is split over 4 jobs by test id (-k).
    timeout-minutes: ${{ matrix.job_timeout || 90 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # setuptools-scm derives the package version from the latest
          # git tag; needs full history.
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set ZALMOXIS_ROOT and FWL_DATA
        run: |
          echo "ZALMOXIS_ROOT=$GITHUB_WORKSPACE" >> $GITHUB_ENV
          echo "FWL_DATA=$RUNNER_TEMP/fwl_data" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest pytest-cov pytest-xdist pytest-timeout hypothesis "proteus-mpl>=1.5.0"

      # The real PALEOS at the commit Zalmoxis tests against, for the iron side tables and their
      # solves; without it those tests skip on the in-process mock.
      - name: Install PALEOS at the tested commit
        run: |
          sha=$(python -c "import re, pathlib; print(re.search(r\"PALEOS_TESTED_SHA = '([0-9a-f]{40})'\", pathlib.Path('src/zalmoxis/eos/paleos_api.py').read_text()).group(1))")
          git clone -q https://github.com/maraattia/PALEOS.git "$RUNNER_TEMP/PALEOS"
          git -C "$RUNNER_TEMP/PALEOS" checkout -q "$sha"
          pip install -e "$RUNNER_TEMP/PALEOS"
          python -c "import paleos, zalmoxis.eos.paleos_api as a; print(paleos.__file__, a.paleos_installed_sha())"

      # The pins live in the installed fwl-io and in src/zalmoxis/datasets.
      - name: Resolve the data cache key
        id: datakey
        run: echo "fwlio=$(python -c 'import fwl_io; print(fwl_io.__version__)')" >> "$GITHUB_OUTPUT"

      # data/ holds links into FWL_DATA, so the cache holds FWL_DATA; a moved key starts
      # from the previous tree, and the setup fetches only missing or damaged files.
      - name: Cache the fwl-io data
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/fwl_data
          key: zalmoxis-fwl-data-${{ runner.os }}-${{ steps.datakey.outputs.fwlio }}-${{ hashFiles('src/zalmoxis/datasets/*.toml', 'src/zalmoxis/datasets/*.txt') }}
          restore-keys: |
            zalmoxis-fwl-data-${{ runner.os }}-

      - name: Fetch the input data and link it into data/
        run: |
          bash tools/setup/get_zalmoxis.sh

      # Drops versions no installed manifest pins, so a restored tree does not grow; a refusal
      # only costs cache space, so it warns instead of failing the tests.
      - name: Prune superseded data versions
        run: fwl-io prune --delete --yes || echo "::warning::fwl-io prune did not run"

      - name: Show the runner CPU
        run: nproc; lscpu | grep -E '^(Model name|CPU\(s\))' || true

      - name: Check that the 2 core jobs run each core test once
        if: matrix.split == 'only'
        run: |
          set -o pipefail
          ids() { pytest -m "${{ matrix.select }}" --collect-only -q -p no:xdist -o "addopts=" "$@" | grep '::' | sort; }
          all="$(ids)"; rest="$(ids --deselect=$CORE_SPLIT)"; part="$(ids $CORE_SPLIT)"
          test -n "$part" && test "$(comm -23 <(echo "$all") <(echo "$rest"))" = "$part" || { printf 'other job drops:\n%s\nthis job runs:\n%s\n' "$(comm -23 <(echo "$all") <(echo "$rest"))" "$part"; exit 1; }

      - name: Run unit + smoke + integration tests with coverage
        env:
          ZALMOXIS_NEED_WOLFBOWER: ${{ matrix.suite == 'wolfbower' && '1' || '' }}
        run: |
          # one thread per xdist worker in the core jobs: 4 workers share the 4 vCPUs
          if [ -n "${{ matrix.threads }}" ]; then
            export OMP_NUM_THREADS=${{ matrix.threads }} OPENBLAS_NUM_THREADS=${{ matrix.threads }} MKL_NUM_THREADS=${{ matrix.threads }}
            pip install -q threadpoolctl && python -m threadpoolctl -i numpy scipy || echo 'thread pools not printed'
          fi
          split=''
          [ "${{ matrix.split }}" = deselect ] && split="--deselect=$CORE_SPLIT"
          [ "${{ matrix.split }}" = only ] && split="$CORE_SPLIT"
          # --timeout names a hung test in the worker-crash report before the job limit
          # cancels the run; a timeout marker on a test takes precedence over it.
          pytest -m "${{ matrix.select }}" -n auto -o "addopts=" -rs \
            --timeout=${{ matrix.test_timeout || 3000 }} --timeout-method=thread --durations=25 \
            --cov=zalmoxis --cov-report=term-missing --cov-report=xml \
            ${{ matrix.args }} $split

      - name: Print the kernel out-of-memory lines
        if: ${{ always() && startsWith(matrix.suite, 'core_two_phase') }}
        continue-on-error: true
        run: |
          # read the log first: a failed dmesg must not read as a run without an OOM kill
          log="$(sudo dmesg -T)"
          test -n "$log" || { echo 'kernel log empty: OOM state unknown'; exit 1; }
          echo "kernel log: $(wc -l <<< "$log") lines"
          grep -iE 'out of memory|oom-kill|killed process' <<< "$log" || echo 'no OOM line'

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: FormingWorlds/Zalmoxis
          files: coverage.xml
          flags: nightly
          fail_ci_if_error: false
