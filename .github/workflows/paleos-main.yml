name: PALEOS main at the tested commit

# One GitHub request, no retry. Fails on a moved main, a missing repository or branch, a
# refused token or permission and an unreadable pin (exits 1, 4, 5, 2), so the scheduled run
# sends its failure notice; a rate limit or a server error (exit 3) only warns.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paleos-main:
    name: PALEOS main is the tested commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare PALEOS main with PALEOS_TESTED_SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/check_paleos_main.py | tee -a "${GITHUB_STEP_SUMMARY}"
          code=${PIPESTATUS[0]}
          if [ "${code}" -eq 3 ]; then
            echo "::warning title=PALEOS main not read::GitHub did not answer; see the summary"
            exit 0
          fi
          exit "${code}"
