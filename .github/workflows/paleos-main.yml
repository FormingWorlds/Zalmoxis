name: PALEOS main at the tested commit

# One GitHub request, no retry. Fails when main does not contain the tested commit, on a
# missing repository, branch or commit, a refused token or permission and an unreadable pin
# (exits 1, 4, 5, 2); main ahead of the tested commit (exit 6) and an unread GitHub (3) warn.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paleos-main:
    name: PALEOS main contains the tested commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare PALEOS main with PALEOS_TESTED_SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/check_paleos_main.py | tee -a "${GITHUB_STEP_SUMMARY}"
          code=${PIPESTATUS[0]}
          if [ "${code}" -eq 3 ]; then
            echo "::warning title=PALEOS main not read::GitHub did not answer; see the summary"
            exit 0
          fi
          if [ "${code}" -eq 6 ]; then
            echo "::warning title=PALEOS main ahead of the tested commit::The pin moves after the PALEOS-API tests pass on the new commits; see the summary"
            exit 0
          fi
          exit "${code}"
