name: PALEOS main at the tested commit

# One GitHub request with the workflow token, no retry. PALEOS main at another commit
# than PALEOS_TESTED_SHA, or a repository or branch that is not found, fails the run, so
# the scheduled run sends its failure notice; another reply that could not be read warns.

on:
  schedule:
    - cron: "37 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paleos-main:
    name: PALEOS main is the tested commit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compare PALEOS main with PALEOS_TESTED_SHA
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          python tools/check_paleos_main.py | tee -a "${GITHUB_STEP_SUMMARY}"
          code=${PIPESTATUS[0]}
          if [ "${code}" -eq 3 ]; then
            echo "::warning title=PALEOS main not read::GitHub did not answer; see the summary"
            exit 0
          fi
          exit "${code}"
